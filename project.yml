name: ScreenTimeAI

options:
  bundleIdPrefix: com.stella
  deploymentTarget:
    iOS: "26.5"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ScreenTimeAI:
    type: application
    platform: iOS
    sources:
      - path: ScreenTimeAI
        excludes:
          - "**/*.example"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stella.ScreenTimeAI
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: ScreenTimeAI/ScreenTimeAI.entitlements
    dependencies:
      - target: DeviceActivityReportExtension
        embed: true
        codeSign: true
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        basedOnDependencyAnalysis: false

  DeviceActivityReportExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityReportExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stella.ScreenTimeAI.DeviceActivityReportExtension
        CODE_SIGN_ENTITLEMENTS: DeviceActivityReportExtension/DeviceActivityReportExtension.entitlements
    info:
      path: DeviceActivityReportExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityreport.extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ReportExtension

schemes:
  ScreenTimeAI:
    build:
      targets:
        ScreenTimeAI: all
        DeviceActivityReportExtension: [build]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
