opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - private_outlet
  - sorted_imports

disabled_rules:
  - trailing_whitespace

excluded:
  - ScreenTimeAI.xcodeproj
  - DeviceActivityReportExtension

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 600

identifier_name:
  min_length:
    warning: 2
    error: 1
